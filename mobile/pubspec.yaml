name: smritivan_app
description: A new Flutter project.
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.0.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  flutter_riverpod: ^2.5.1
  drift: ^2.16.0
  sqlite3_flutter_libs: ^0.5.21
  path_provider: ^2.1.2
  path: ^1.9.0
  shared_preferences: ^2.2.2
  uuid: ^4.3.3
  audioplayers: ^6.0.0
  sqflite_sqlcipher: ^3.4.1
  flutter_secure_storage: ^11.0.0
  encrypt: ^5.0.3
  flutter_tts: ^4.2.5
  google_fonts: ^8.2.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  drift_dev: ^2.16.0
  flutter_launcher_icons: ^0.9.3
flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/objects/
    - assets/audio/
  generate: true

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/app_logo.jpg"
  min_sdk_android: 21
  remove_alpha_ios: true
